<!doctype html>
<html lang="es">

<head>
    <meta charset="utf-8">
    <title>Adivina, adivinanza...</title>
    <style>
        body {
            background: #ffebce;
            font-family: Arial, sans-serif
        }

        h1 {
            color: #995900;
            text-transform: uppercase;
            font-size: 44px
        }


        p {
            font-size: 24px;
        }

        p.intro {
            color: #ff9500;
        }

        summary {
            font-size: 32px;
        }

        span.par {
            background-color: white;
        }

        span.impar {
            background-color: #ffccea;
        }
    </style>
</head>

<body>
    <main>
        <h1>Adivina, adivinanza ...</h1>
        <p class="intro">¿Sabrías decir los títulos de estas películas?</p>
        <details>
            <summary><span class="par">🌍🐵🐵🐵</span></summary>
            <p class="respuesta">El planeta de los simios</p>
        </details>
        <details>
            <summary><span class="impar">🔫👻👻👻</span></summary>
            <p class="respuesta">Los cazafantasmas</p>
        </details>
        <details>
            <summary><span class="par">👰👰👰👰💀</span></summary>
            <p class="respuesta">Cuatro bodas y un funeral</p>
        </details>
        <details>
            <summary><span class="impar">🔪🚿</span></summary>
            <p class="respuesta">Psicosis</p>
        </details>
        <details>
            <summary><span class="par">🔇🐑🐑🐑</span></summary>
            <p class="respuesta">El silencio de los corderos</p>
        </details>
    </main>
</body>

</html>
